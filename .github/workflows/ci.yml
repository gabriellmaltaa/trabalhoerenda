name: Verificar projeto
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npx -y firebase-tools@15.36.0 emulators:exec --only firestore --project demo-trabalhoerenda 'node --test tests/firestore.rules.test.mjs'
